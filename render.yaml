services:
  - type: web
    name: recro-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free  # Change to "starter" or "standard" for production
    healthCheckPath: /api/v1/health
    envVars:
      - key: FRONTEND_BASE_URL
        fromService:
          type: web
          name: recro-ai
          property: host
      - key: LOG_LEVEL
        value: INFO
      - key: LOG_LLM
        value: WARNING
      # Configure your AI provider via the Settings UI (/settings)
      # or uncomment and set these environment variables:
      # - key: LLM_PROVIDER
      #   value: openai
      # - key: LLM_MODEL
      #   value: gpt-4o-mini
      # - key: LLM_API_KEY
      #   sync: false  # Will be set as a secret in Render dashboard
    disk:
      name: resume-data
      mountPath: /app/backend/data
      sizeGB: 1
